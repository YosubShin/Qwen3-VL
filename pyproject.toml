[project]
name = "qwen-vl-finetune"
version = "0.1.0"
description = "Finetune Qwen3-VL"
readme = "README.md"
requires-python = ">=3.10,<=3.12"

# Core dependencies shared by both Mac (CPU/MPS) and HPC (CUDA)
dependencies = [
    "pandas>=2.2.0",
    "pillow>=10.3.0",
    "huggingface_hub>=0.23.0",
    "transformers==4.57.1",
    "wandb",
    "setuptools",
    "tqdm",
    "requests",
    "validators",
    "qwen-vl-utils",
    "peft==0.17.1",
    "ninja",
    "accelerate==1.7.0",
    "datasets",
]

[project.optional-dependencies]
# HPC group adds distributed / CUDA-related tools,
# but leaves torch/torchvision/torchaudio to be installed manually
hpc = [
    "deepspeed==0.17.1",
    "torchcodec==0.2",
    "triton",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "flash-attn==2.7.4.post1",
]
visualize = [
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.5",
]

[tool.uv]
package = false
no-build-isolation-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", extra = "hpc", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu124", extra = "hpc", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu124", extra = "hpc", marker = "sys_platform == 'linux'" },
]
